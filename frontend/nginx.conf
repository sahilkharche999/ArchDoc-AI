server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets (JS, CSS, images) for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
