version: "3.9"

services:
  frontend:
    image: dax-frontend-image:latest
    container_name: dax-frontend
    ports:
      - "80:80"
    depends_on:
      - backend


  backend:
    image: dax-backend-image:latest
    container_name: dax-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  memgraph:
    image: memgraph/memgraph:latest
    container_name: dax-memgraph
    ports:
      - "7687:7687"
      - "3000:3000"
